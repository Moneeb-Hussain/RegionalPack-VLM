# Frozen before any benchmark response. Do not edit this file after reading model output.
# The code in src/scoring.py is the implementation. A CPU test checks that the
# category table below matches CATEGORY_ACCEPT.

frozen_before_responses: true
product_aggregation:
  brand: "strict majority of the 3 photographs; at least 2 of 3 correct. Fewer than 3 decided photographs is incomplete, not incorrect."
  category: "same majority rule as brand."
  ocr: "not a vote. Report the mean and the minimum-to-maximum range across the 3 photographs, separately for Latin and Urdu."
primary_comparison:
  rule: "comparison_role exploratory is excluded from the primary brand and category rates."
  exploratory_product_ids:
    - apple_fruita
    - apple_fruitien
brand_accuracy:
  rule: "Primary brand accuracy uses configs/brand_aliases.yaml aliases only. A parent_names string alone is not a hit. Bisconni is not Rite. Shan alone is not Shoop. CandyLand alone is not YOU. Nestlé alone is not Fruita Vitals."
  abstention: "brand_match false is not a wrong-brand assertion. A hedge also fails the alias check. Assertion type is a separate human code."
category_accuracy:
  rule: "Correct when Prompt 3 contains one accepted phrase for the manifest category. The phrase match is the same folding used for aliases."
category_accept:
  cola: [cola, beverage, soft drink, drink]
  biscuit: [biscuit, cookie, snack]
  tea: [tea, beverage]
  chocolate: [chocolate, confectionery, candy, snack]
  chips: [chip, crisp, snack]
  detergent: [detergent, cleaning, laundry]
  toothpaste: [toothpaste, oral, dental]
  apple: [juice, nectar, beverage, drink]
  noodles: [noodle, instant noodle]
  soap: [soap, bath]
ocr:
  scope: "front-of-pack wordmark, product or flavor name, and prominent tagline. Ingredient lists, nutrition tables, barcodes, and regulatory fine print are out of scope."
  eligibility: "review_status must be verified. needs_review and blank review_status are not ground truth."
  empty_reference: "An empty ground-truth string is not a missed transcription and is not scored."
  normalization: "Unicode NFC. Collapse whitespace. Casefold Latin only. Do not casefold Urdu. Do not strip punctuation inside CER."
  latin_metric: "CER, plus WER on whitespace-separated words after the same Latin normalization."
  urdu_metric: "CER only. WER is not computed for Urdu script."
  scripts: "Latin and Urdu are scored separately. A blank Urdu cell on an unverified row does not mean the script is absent."
assertion_types:
  coded_by: "a person reading the raw response after inference"
  not_automatic: true
  labels:
    - correct
    - hedge-or-abstain
    - wrong-specific-international-brand
    - wrong-specific-local-brand
    - wrong-generic-or-unrelated
    - inconsistent-across-photos
  product_rule: "Modal label across the 3 photographs. Three different labels is inconsistent-across-photos, not a forced choice."
angles_note: "straight, tilt, and occluded are phone capture conditions. This is not a controlled 3D viewpoint experiment."
